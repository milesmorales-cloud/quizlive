<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - QuizLive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        :root {
            --slate-950: #020617;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-400: #94a3b8;
            --accent-cyan: #06b6d4;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
        }

        body {
            background: radial-gradient(1000px 600px at 50% -10%, rgba(251, 191, 36, 0.12), transparent 60%),
                        var(--slate-950);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .podium-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .podium-avatar {
            width: 84px;
            height: 84px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: white;
            border: 4px solid;
            margin-bottom: 0.75rem;
        }

        .podium-block {
            width: 100%;
            border-radius: 1rem 1rem 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 1rem;
        }

        .podium-rank {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .btn-dashboard {
            background: linear-gradient(135deg, var(--accent-cyan), #10b981);
            color: white;
            border: none;
            border-radius: 1rem;
            padding: 1rem 2.5rem;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            text-decoration: none;
        }

        .btn-dashboard:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(6, 182, 212, 0.5);
        }

        .crown {
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="w-full max-w-2xl mx-auto text-center">
        <!-- Header -->
        <div class="mb-10">
            <div class="inline-flex items-center gap-2 mb-4">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <span class="font-extrabold text-white text-lg">QuizLive</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-2">Game Over!</h1>
            <p class="text-slate-400">Here's how everyone scored</p>
        </div>

        <!-- Podium -->
        <div id="podium" class="flex items-end justify-center gap-2 sm:gap-4 mb-10 min-h-[300px]">
            <p class="text-slate-500 self-center">Loading results...</p>
        </div>

        <!-- Back to Dashboard -->
        <a href="teacher-dashboard.html" class="btn-dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1"/>
                <rect x="14" y="3" width="7" height="5" rx="1"/>
                <rect x="14" y="12" width="7" height="9" rx="1"/>
                <rect x="3" y="16" width="7" height="5" rx="1"/>
            </svg>
            Back to Dashboard
        </a>
    </div>

    <script src="js/sound.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
        // Feature 3: celebratory fanfare + confetti once the results are in.
        function celebrate() {
            if (typeof QuizLiveSound !== 'undefined') {
                QuizLiveSound.play('gameover');
            }
            if (typeof confetti === 'function') {
                confetti({ particleCount: 140, spread: 75, origin: { y: 0.6 } });
                setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 60, origin: { x: 0 } }), 250);
                setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 60, origin: { x: 1 } }), 450);
            }
        }

        function loadResults() {
            const podium = document.getElementById('podium');
            let leaderboard = [];

            try {
                leaderboard = JSON.parse(localStorage.getItem('quizlive_leaderboard') || '[]');
            } catch (e) {
                leaderboard = [];
            }

            if (!leaderboard || leaderboard.length === 0) {
                podium.innerHTML = '<p class="text-slate-500">No results available yet.</p>';
                return;
            }

            // Order: 1st, 2nd, 3rd
            const sorted = [...leaderboard].sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 3);

            // Podium layout: [2nd, 1st, 3rd]
            const order = [sorted[1], sorted[0], sorted[2]];

            const config = {
                0: { rank: 2, color: 'var(--silver)', height: '120px', medal: '2nd', label: 'text-slate-200' },
                1: { rank: 1, color: 'var(--gold)', height: '180px', medal: '1st', label: 'text-amber-300' },
                2: { rank: 3, color: 'var(--bronze)', height: '90px', medal: '3rd', label: 'text-orange-400' }
            };

            podium.innerHTML = order.map((player, i) => {
                if (!player) {
                    return `<div class="podium-player" style="height: ${config[i].height}"></div>`;
                }

                const c = config[i];
                const initial = (player.username || '?').charAt(0).toUpperCase();
                const crown = i === 1 ? `
                    <div class="crown mb-2">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="#fbbf24">
                            <path d="M2 18l3-9 4 4 3-8 3 8 4-4 3 9z"/>
                        </svg>
                    </div>` : '';

                return `
                    <div class="podium-player">
                        ${crown}
                        <div class="podium-avatar" style="border-color: ${c.color}; background: linear-gradient(135deg, ${c.color}, ${c.color}88);">
                            ${initial}
                        </div>
                        <p class="font-bold text-white mb-1 truncate max-w-[120px]">${player.username || 'Player'}</p>
                        <p class="font-extrabold ${c.label} text-xl mb-3 tabular-nums">${player.score || 0} pts</p>
                        <div class="podium-block" style="height: ${c.height}; background: linear-gradient(180deg, ${c.color}cc, ${c.color}66);">
                            <span class="podium-rank" style="color: white;">${c.medal}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadResults();
        celebrate();
    </script>
</body>
</html>
