<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Quiz - QuizLive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        :root {
            --slate-950: #020617;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-400: #94a3b8;
            --accent-cyan: #06b6d4;
            --answer-red: #ef4444;
            --answer-blue: #3b82f6;
            --answer-yellow: #eab308;
            --answer-green: #22c55e;
        }

        body {
            background: var(--slate-950);
            min-height: 100vh;
            margin: 0;
        }

        /* Answer Pads */
        .answer-pad {
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: all 0.15s ease;
            min-height: 160px;
            padding: 1.5rem;
        }

        .answer-pad.red {
            background: linear-gradient(145deg, #dc2626, #b91c1c);
            box-shadow: 0 10px 30px -10px rgba(239, 68, 68, 0.6);
        }

        .answer-pad.blue {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.6);
        }

        .answer-pad.yellow {
            background: linear-gradient(145deg, #eab308, #ca8a04);
            box-shadow: 0 10px 30px -10px rgba(234, 179, 8, 0.6);
        }

        .answer-pad.green {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            box-shadow: 0 10px 30px -10px rgba(34, 197, 94, 0.6);
        }

        .answer-pad:hover:not(.disabled) {
            transform: translateY(-4px) scale(1.02);
            filter: brightness(1.08);
        }

        .answer-pad:active:not(.disabled) {
            transform: scale(0.97);
        }

        .answer-pad.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.4);
        }

        .answer-pad.selected {
            outline: 4px solid white;
            transform: scale(1.03);
        }

        /* Countdown Ring */
        .timer-ring {
            width: 160px;
            height: 160px;
        }

        .timer-ring circle {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
        }

        .timer-bg {
            stroke: var(--slate-800);
        }

        .timer-fg {
            stroke: var(--accent-cyan);
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Game-over wait screen: players park here until the host reveals results -->
    <div id="finishedOverlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center px-6 text-center" style="background: radial-gradient(1000px 500px at 50% -10%, rgba(6, 182, 212, 0.12), transparent 60%), #020617;">
        <div class="w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center mb-6" style="box-shadow: 0 0 0 8px rgba(6, 182, 212, 0.12), 0 20px 50px -12px rgba(16, 185, 129, 0.4);">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
        </div>
        <h2 class="text-3xl font-extrabold text-white tracking-tight mb-2">You're all done!</h2>
        <p class="text-slate-300 text-lg mb-6">The host is wrapping up the game. Waiting for them to reveal the results…</p>
        <p class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800 border border-slate-700 text-slate-300 text-sm font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Waiting for the host
        </p>
    </div>

    <div class="min-h-screen flex flex-col px-4 py-6 max-w-3xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <span class="font-bold text-white">QuizLive</span>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-500">PIN <span id="headerPin" class="font-bold text-slate-300">------</span></p>
                <p id="questionProgress" class="text-xs text-slate-500 font-medium mt-0.5">Question 1 of 1</p>
            </div>
        </div>

        <!-- Countdown Ring + Question -->
        <div class="flex flex-col items-center mb-8">
            <div class="relative timer-ring mb-8">
                <svg class="w-full h-full" viewBox="0 0 160 160">
                    <circle class="timer-bg" cx="80" cy="80" r="70"></circle>
                    <circle class="timer-fg" id="timerFg" cx="80" cy="80" r="70"
                        stroke-dasharray="439.8" stroke-dashoffset="0"
                        transform="rotate(-90 80 80)"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="timerText" class="text-5xl font-extrabold text-white tabular-nums">--</span>
                </div>
            </div>

            <div class="text-center max-w-xl w-full">
                <p id="questionText" class="text-2xl md:text-3xl font-bold text-white leading-snug">
                    Waiting for the first question...
                </p>
            </div>
        </div>

        <!-- Answer Pads -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
            <button class="answer-pad red" data-letter="A" onclick="submitAnswer(this)">
                <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
                    <polygon points="16,4 28,28 4,28" fill="rgba(255,255,255,0.25)"/>
                    <polygon points="16,4 28,28 4,28" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <span class="pad-letter text-white font-bold text-xl">A</span>
                <span class="pad-option text-white text-base font-semibold text-center leading-snug">—</span>
            </button>

            <button class="answer-pad blue" data-letter="B" onclick="submitAnswer(this)">
                <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
                    <polygon points="16,3 29,16 16,29 3,16" fill="rgba(255,255,255,0.25)"/>
                    <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <span class="pad-letter text-white font-bold text-xl">B</span>
                <span class="pad-option text-white text-base font-semibold text-center leading-snug">—</span>
            </button>

            <button class="answer-pad yellow" data-letter="C" onclick="submitAnswer(this)">
                <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="16" r="13" fill="rgba(255,255,255,0.25)"/>
                    <circle cx="16" cy="16" r="13" fill="none" stroke="white" stroke-width="2"/>
                </svg>
                <span class="pad-letter text-white font-bold text-xl">C</span>
                <span class="pad-option text-white text-base font-semibold text-center leading-snug">—</span>
            </button>

            <button class="answer-pad green" data-letter="D" onclick="submitAnswer(this)">
                <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
                    <rect x="5" y="5" width="22" height="22" rx="2" fill="rgba(255,255,255,0.25)"/>
                    <rect x="5" y="5" width="22" height="22" rx="2" fill="none" stroke="white" stroke-width="2"/>
                </svg>
                <span class="pad-letter text-white font-bold text-xl">D</span>
                <span class="pad-option text-white text-base font-semibold text-center leading-snug">—</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/app.js"></script>

    <script>
        const pin = localStorage.getItem('quizlive_pin');
        document.getElementById('headerPin').textContent = pin || '------';

        const CIRCUMFERENCE = 2 * Math.PI * 70; // ≈ 439.8
        const timerFg = document.getElementById('timerFg');
        const timerText = document.getElementById('timerText');
        const questionText = document.getElementById('questionText');
        const questionProgress = document.getElementById('questionProgress');

        let currentQuestion = null;
        let timeRemaining = 0;
        let timeTotal = 30;
        let answered = false;

        // --- Question flow ---

        socket.on('next-question', (data) => {
            answered = false;
            currentQuestion = data.question;

            questionText.textContent = currentQuestion.text;
            questionProgress.textContent = `Question ${data.questionIndex + 1} of ${data.totalQuestions}`;

            timeTotal = currentQuestion.timeLimit || 30;
            timeRemaining = timeTotal;
            resetTimer(timeTotal, timeTotal);
            QuizLiveSound.resetTick();

            // Fill each pad with the option text for THIS student's shuffled
            // layout. The server sends options keyed by the displayed letter,
            // so pad A shows options.A regardless of where the real answer sits.
            document.querySelectorAll('.answer-pad').forEach((pad) => {
                const letter = pad.dataset.letter;
                const textEl = pad.querySelector('.pad-option');
                const options = currentQuestion.options || {};
                if (textEl) {
                    textEl.textContent = options[letter] && options[letter].trim() ? options[letter] : '—';
                }
                pad.classList.remove('disabled', 'selected');
            });
        });

        socket.on('timer-tick', (data) => {
            timeRemaining = data.remaining;
            updateTimer(data.remaining, data.total || timeTotal);

            // Tick sound on the final seconds of the countdown
            if (data.remaining <= 3 && data.remaining > 0) {
                QuizLiveSound.tickAtSecond(data.remaining);
            }
        });

        socket.on('question-already-answered', (data) => {
            // The player rejoined mid-question and had already locked an answer
            // before disconnecting. Re-lock their pads and highlight their pick.
            if (!data || data.displayAnswer === undefined) return;
            answered = true;
            document.querySelectorAll('.answer-pad').forEach((pad) => {
                const selected = pad.dataset.letter === data.displayAnswer;
                pad.classList.toggle('selected', selected);
                pad.classList.add('disabled');
                if (selected) pad.style.outline = '4px solid white';
            });
        });

        socket.on('question-time-up', (data) => {
            // Reveal sound + highlight the correct pad briefly
            QuizLiveSound.play('reveal');
            const letter = data.correctAnswer;
            const correctPad = document.querySelector(`.answer-pad[data-letter="${letter}"]`);
            if (correctPad) {
                correctPad.classList.add('selected');
            }
            document.querySelectorAll('.answer-pad').forEach((pad) => {
                pad.classList.add('disabled');
            });
        });

        socket.on('game-finished', (data) => {
            // Save the final leaderboard so results.html can render instantly
            // when the host reveals. The player does NOT auto-advance — they
            // wait on the overlay below until the host's 'show-results' arrives.
            localStorage.setItem('quizlive_leaderboard', JSON.stringify(data.leaderboard || []));
            const overlay = document.getElementById('finishedOverlay');
            if (overlay) overlay.classList.remove('hidden');
        });

        // Host clicked "Show Results" on their screen → every player goes to
        // the podium. Payload re-carries the leaderboard so a player who
        // reconnected straight into the reveal still has the data.
        socket.on('show-results', (data) => {
            if (data && data.leaderboard) {
                localStorage.setItem('quizlive_leaderboard', JSON.stringify(data.leaderboard));
            }
            window.location.href = 'results.html';
        });

        // --- Timer helpers ---

        function resetTimer(remaining, total) {
            timerText.textContent = remaining;
            setRing(total > 0 ? remaining / total : 0);
            timerFg.style.stroke = 'var(--accent-cyan)';
        }

        function updateTimer(remaining, total) {
            timerText.textContent = remaining;
            setRing(total > 0 ? remaining / total : 0);

            if (remaining <= 5) {
                timerFg.style.stroke = '#ef4444';
            } else if (remaining <= 10) {
                timerFg.style.stroke = '#eab308';
            } else {
                timerFg.style.stroke = 'var(--accent-cyan)';
            }
        }

        function setRing(ratio) {
            const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, ratio)));
            timerFg.style.strokeDashoffset = offset;
        }

        // --- Answer submission ---

        function submitAnswer(pad) {
            if (answered || !currentQuestion || pad.classList.contains('disabled')) {
                return;
            }

            answered = true;
            pad.classList.add('selected');

            document.querySelectorAll('.answer-pad').forEach((p) => p.classList.add('disabled'));

            const answer = pad.dataset.letter;

            socket.emit('submit-answer', {
                pin,
                questionId: currentQuestion.id,
                answer,
                timeRemaining
            }, (response) => {
                if (response && response.success) {
                    // Flash correct/incorrect on the pad + play feedback sound
                    if (response.isCorrect) {
                        pad.style.outline = '4px solid white';
                        QuizLiveSound.play('correct');
                    } else {
                        pad.style.filter = 'brightness(0.5)';
                        QuizLiveSound.play('wrong');
                    }
                }
            });
        }

        // Initial ring state
        timerFg.style.strokeDasharray = CIRCUMFERENCE;
        timerFg.style.strokeDashoffset = 0;
    </script>
</body>
</html>
