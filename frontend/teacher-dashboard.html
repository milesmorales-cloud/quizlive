<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - QuizLive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        :root {
            --slate-950: #020617;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
        }

        body {
            background: var(--slate-950);
            min-height: 100vh;
            margin: 0;
        }

        /* Sidebar */
        .sidebar {
            background: var(--slate-900);
            border-right: 1px solid var(--slate-800);
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: var(--slate-400);
            font-weight: 500;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .sidebar-link:hover {
            background: var(--slate-800);
            color: var(--slate-300);
        }

        .sidebar-link.active {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--slate-900);
            border: 1px solid var(--slate-800);
            border-radius: 1.25rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .quiz-card:hover {
            border-color: var(--slate-700);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.6);
        }

        .btn-host {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.625rem 1rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-host:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(6, 182, 212, 0.5);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            border-radius: 0.75rem;
            padding: 0.625rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
            transform: translateY(-1px);
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            border-radius: 0.75rem;
            padding: 0.625rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-decoration: none;
        }

        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #3b82f6;
            transform: translateY(-1px);
        }

        .btn-create {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
            color: white;
            border: none;
            border-radius: 1rem;
            padding: 1rem 1.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            text-decoration: none;
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(6, 182, 212, 0.5);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            border: 2px dashed var(--slate-800);
            border-radius: 1.25rem;
            grid-column: 1 / -1;
        }

        /* Skeleton Loading */
        .skeleton {
            background: var(--slate-800);
            border-radius: 1.25rem;
            height: 220px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--slate-700);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--slate-800);
            }
        }
    </style>
    <script>
        // Auth guard — must be first thing that runs
        (function() {
            if (!localStorage.getItem('teacherToken')) {
                window.location.replace('login.html');
            }
        })();
    </script>
</head>
<body>
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="sidebar w-full md:w-64 flex-shrink-0 p-4 flex md:flex-col gap-2">
            <div class="flex items-center gap-2 px-2 mb-6">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <span class="font-bold text-white text-lg">QuizLive</span>
            </div>

            <nav class="flex md:flex-col gap-1">
                <a href="#" class="sidebar-link active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9" rx="1"/>
                        <rect x="14" y="3" width="7" height="5" rx="1"/>
                        <rect x="14" y="12" width="7" height="9" rx="1"/>
                        <rect x="3" y="16" width="7" height="5" rx="1"/>
                    </svg>
                    Dashboard
                </a>
                <a href="create-quiz.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 8v8M8 12h8"/>
                    </svg>
                    Create Quiz
                </a>
                <a href="statistics.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18"/>
                        <path d="M18 17V9M13 17V5M8 17v-3"/>
                    </svg>
                    Statistics
                </a>
                <a href="index.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Home
                </a>
            </nav>

            <div class="mt-auto pt-6 hidden md:block">
                <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-800/50 border border-slate-700">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center text-white font-bold">T</div>
                    <div>
                        <p class="text-sm font-semibold text-white">Teacher</p>
                        <p class="text-xs text-slate-500">Online</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-10">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
                    <div>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight">Your Manual Quizzes</h1>
                        <p class="text-slate-400 mt-1">All quizzes you've created, ready to host.</p>
                    </div>
                    <a href="create-quiz.html" class="btn-create">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        Create New Quiz
                    </a>
                </div>

                <!-- Quiz Grid -->
                <div id="quizGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>

    <script>
        // ============================================================
        // Fetch quizzes from the backend API and populate the grid
        // ============================================================

        const quizGrid = document.getElementById('quizGrid');
        const API_BASE = window.location.origin;

        function showLoading() {
            quizGrid.innerHTML = `
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            `;
        }

        function showEmpty() {
            quizGrid.innerHTML = `
                <div class="empty-state">
                    <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mb-4">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--slate-500)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                    </div>
                    <h3 class="text-white font-bold text-lg mb-1">No quizzes yet</h3>
                    <p class="text-slate-500 text-sm mb-6">Create your first quiz to start hosting live games.</p>
                    <a href="create-quiz.html" class="btn-host" style="max-width: 240px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        Create New Quiz
                    </a>
                </div>
            `;
        }

        function showError() {
            quizGrid.innerHTML = `
                <div class="empty-state">
                    <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center mb-4">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <h3 class="text-white font-bold text-lg mb-1">Couldn't load quizzes</h3>
                    <p class="text-slate-500 text-sm mb-4">Make sure the backend server is running on port 3000.</p>
                    <button class="btn-host" style="max-width: 240px; background: var(--slate-700);" onclick="loadQuizzes()">
                        Retry
                    </button>
                </div>
            `;
        }

        function renderQuizzes(quizzes) {
            if (!quizzes || quizzes.length === 0) {
                showEmpty();
                return;
            }

            quizGrid.innerHTML = quizzes.map((quiz) => {
                const date = new Date(quiz.created_at).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

                return `
                    <div class="quiz-card flex flex-col">
                        <div class="flex items-start justify-between mb-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-emerald-500/20 border border-cyan-500/30 flex items-center justify-center">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 11l3 3L22 4"/>
                                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                                </svg>
                            </div>
                            <span class="text-xs text-slate-500">${date}</span>
                        </div>

                        <h3 class="text-white font-bold text-lg mb-1 line-clamp-2">${quiz.title || 'Untitled Quiz'}</h3>
                        <p class="text-slate-400 text-sm mb-4 line-clamp-2 flex-1">
                            ${quiz.description || 'No description provided.'}
                        </p>

                        <div class="flex items-center gap-3">
                            <span class="inline-flex items-center gap-1.5 text-xs text-slate-400">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                                </svg>
                                ${quiz.questionCount ?? '—'} questions
                            </span>
                        </div>

                        <div class="flex items-center gap-2 mt-4">
                            <button
                                class="btn-host flex-1"
                                onclick="hostGame(${quiz.id})"
                            >
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 3l14 9-14 9V3z"/>
                                </svg>
                                Host Live Game
                            </button>
                            <a href="create-quiz.html?edit=${quiz.id}" class="btn-edit" title="Edit quiz" aria-label="Edit quiz">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </a>
                            <button
                                class="btn-delete"
                                onclick="deleteQuiz(${quiz.id}, this)"
                                title="Delete quiz"
                                aria-label="Delete quiz"
                            >
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                    <path d="M10 11v6M14 11v6"/>
                                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadQuizzes() {
            showLoading();

            try {
                // GET request to the backend API to fetch all quizzes
                const response = await fetch(`${API_BASE}/api/quizzes`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch quizzes');
                }

                renderQuizzes(data);
            } catch (err) {
                console.error('Failed to load quizzes:', err);
                showError();
            }
        }

        // Load quizzes on page load
        loadQuizzes();

        async function deleteQuiz(quizId, btn) {
            if (!confirm('Are you sure you want to delete this entire quiz? This cannot be undone.')) return;

            btn.disabled = true;
            btn.style.opacity = '0.5';

            try {
                const res = await fetch(`${API_BASE}/api/quizzes/${quizId}`, { method: 'DELETE' });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Delete failed.');

                // Animate the card out then remove it
                const card = btn.closest('.quiz-card');
                card.style.transition = 'all 0.3s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    card.remove();
                    // If grid is now empty, show empty state
                    const remaining = document.querySelectorAll('#quizGrid .quiz-card');
                    if (remaining.length === 0) showEmpty();
                }, 300);
            } catch (err) {
                console.error('Delete error:', err);
                alert('Could not delete quiz: ' + err.message);
                btn.disabled = false;
                btn.style.opacity = '';
            }
        }
    </script>
</body>
</html>
